
name: Compilar Vocal AI Studio para FL Studio

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-macos:
    name: Compilar VST3 y AU para Mac
    runs-on: macos-14

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar herramientas
        run: brew install ninja

      - name: Configurar proyecto
        run: |
          cmake --version
          rm -rf build

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DVAS_FETCH_JUCE=ON

      - name: Compilar plugins
        run: cmake --build build --config Release --parallel 3

      - name: Ejecutar pruebas informativas
        continue-on-error: true
        run: |
          ctest --test-dir build \
            --output-on-failure

      - name: Preparar VST3 y AU
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          VST3="$(find build -type d \
            -name '*.vst3' -print -quit)"

          AU="$(find build -type d \
            -name '*.component' -print -quit)"

          if [ -z "$VST3" ]; then
            echo "::error::No se ha generado el plugin VST3."
            exit 1
          fi

          ditto -c -k --sequesterRsrc --keepParent \
            "$VST3" \
            dist/VocalAIStudio-macOS-VST3.zip

          if [ -n "$AU" ]; then
            ditto -c -k --sequesterRsrc --keepParent \
              "$AU" \
              dist/VocalAIStudio-macOS-AU.zip
          else
            echo "::warning::No se ha encontrado el plugin AU."
          fi

          echo "Plugins preparados:"
          ls -lh dist

      - name: Publicar plugins descargables
        uses: actions/upload-artifact@v4
        with:
          name: VocalAIStudio-macOS
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30
